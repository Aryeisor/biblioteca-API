services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ evita que compose interpole; lo resuelve el shell del contenedor
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Contadores del rate limiting. Son efímeros: sin persistencia (si se reinicia, los contadores
  # empiezan en 0, igual que antes en memoria). El puerto solo se publica en 127.0.0.1 para poder
  # correr `npm run dev` o los tests desde tu equipo; no queda expuesto a la red.
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Trabajo de una sola vez: aplica las migraciones pendientes y termina. La API no arranca hasta
  # que termina bien (service_completed_successfully), así nunca corre con un esquema desactualizado.
  migrar:
    build: .
    command: ['node', 'dist/migraciones/cli.js']
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    build: .
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    environment:
      PORT: ${PORT:-3000}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REDIS_URL: redis://redis:6379
    healthcheck:
      # liveness, no readiness: si la base cae, reiniciar la API no lo arregla
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:${PORT:-3000}/health']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    # más que el temporizador de seguridad de server.js (10 s): Docker manda SIGKILL al vencer
    stop_grace_period: 15s
    depends_on:
      db:
        condition: service_healthy
      migrar:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
